[package]
name = "astraea-workstation"
version = "0.1.0"
description = "Astraea rocket engineering workstation (Tauri shell over astraea-core)"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "astraea_workstation_lib"
path = "src/lib.rs"

[[bin]]
name = "astraea-workstation"
path = "src/main.rs"

[dependencies]
astraea-core = { path = "../crates/astraea-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = [] }

[build-dependencies]
tauri-build = "2.6.3"
