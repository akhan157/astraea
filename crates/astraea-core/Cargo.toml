[package]
name = "astraea-core"
version = "0.11.0"
edition = "2021"
description = "Astraea compute engines — Tauri-ready Rust core (TS frontend untouched; TS is the oracle)"
license = "Apache-2.0"

[lib]
name = "astraea_core"
path = "src/lib.rs"

[features]
e1-test-hooks = []

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
