name: Release

# Pushing a tag such as v0.10.0 builds the desktop app on Linux, Windows and
# macOS and attaches the bundles to a draft GitHub release for review.
# Bundles: Windows and Linux remain unsigned; macOS is ad-hoc signed, so
# Gatekeeper still warns but the app is not reported as damaged. Updates ARE
# signed: the updater key's private half must be a repository secret
# (TAURI_SIGNING_PRIVATE_KEY, the contents of ~/.tauri/astraea-updater.key; its
# password secret is empty), and the published release carries the latest.json
# the app polls.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/astraea-engine
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Astraea v__VERSION__'
          releaseBody: 'Beta (0.10). Apogee was tested blind on one small subsonic rocket: predictions ran 6–10% high. Other vehicles and supersonic flight are untested. Not flight approval. See docs/accuracy.md and CHANGELOG.md.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
