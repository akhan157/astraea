name: Release

# Pushing a tag such as v0.10.0 builds the desktop app on Linux, Windows and
# macOS and attaches the bundles to a draft GitHub release for review.
# Bundles: Windows and Linux remain unsigned; macOS is ad-hoc signed, so
# Gatekeeper still warns but the app is not reported as damaged. Updates ARE
# signed: the updater key's private half must be a repository secret
# (TAURI_SIGNING_PRIVATE_KEY, the contents of ~/.tauri/astraea-updater.key; its
# password secret is empty), and the published release carries the latest.json
# the app polls.
#
# Before any bundle is built, `preflight` checks that the version agrees across
# package.json, Cargo.toml, Cargo.lock, CHANGELOG.md, README.md and the tag, and
# takes the release notes from the CHANGELOG.md section; `ci` runs the full CI
# suite at the tagged commit. Either failing stops the release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: 24
      - id: notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node scripts/release-preflight.mjs ${TAG:+--tag "$TAG"} --notes-out "$RUNNER_TEMP/notes.md"
          { echo 'notes<<RELEASE_NOTES_EOF'; cat "$RUNNER_TEMP/notes.md"; echo 'RELEASE_NOTES_EOF'; } >> "$GITHUB_OUTPUT"

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bundle:
    needs: [preflight, ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            crates/astraea-engine
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Astraea v__VERSION__'
          releaseBody: ${{ needs.preflight.outputs.notes }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
